context: |
  Project: Session Zero, a browser-based virtual tabletop for remote D&D-style play.
  README.md defines product requirements by FR ID. docs/DESIGN.md and
  docs/DELIVERY.md describe the current architecture and delivery slices;
  inspect the implementation before proposing changes because some features
  in those documents are planned rather than built.

  Current implementation:
    - npm workspaces: packages/shared (zod state, commands, events, decision,
      reduction, visibility), apps/server (Express, Socket.IO), apps/web
      (React, TypeScript, PixiJS board).
    - Persistence adapters include Prisma/Postgres, Redis, and asset storage;
      memory implementations support development and tests.
    - Accounts and cookie sessions are implemented. Signed-in owners have
      libraries and private AI builds. Guest hosting supports limited rooms;
      guest room credentials do not authorize library or build access.
    - Grid metadata uses map-image pixels. Manual correction, automatic grid
      detection and private map editors are implemented.
    - apps/mcp serves player tools at /mcp and deterministic private-build
      tools at /mcp/build. Builds support files, grids, walls, doors/windows,
      permanent terrain, creatures, encounters and owner-only publication.
      Users supply their own AI; the builder does not invoke a backend LLM.
    - Inspect deployed behavior separately from checked-in code. Public MCP
      reachability and real chat-client compatibility are not established by
      local tests or an edge proxy's browser challenge response.

  Design rules:
    - The server owns persistent room state. Commands are authorized in
      packages/shared, converted to events, appended, reduced, and broadcast.
    - Events have monotonically increasing room sequence numbers. Ephemeral
      previews are not persisted and do not receive sequence numbers.
    - Filter every room payload for the viewer so hidden GM information never
      reaches players.
    - Changes to existing shared schemas need an ADR and review by the
      real-time architecture owner (CLAUDE.md).
    - No feature ships tiered or paywalled.

