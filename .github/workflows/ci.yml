name: CI

on:
  push:
    branches: [main, design]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vtt
          POSTGRES_PASSWORD: vtt
          POSTGRES_DB: vtt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vtt -d vtt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=@vtt/server

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test AI build storage on PostgreSQL
        env:
          DATABASE_URL: postgres://vtt:vtt@localhost:5432/vtt_test
        run: |
          npm run prisma:migrate --workspace=@vtt/server
          npm run test --workspace=@vtt/server -- test/buildStore.test.ts test/buildPublish.test.ts test/buildTerrain.test.ts

      - name: Test vision service (grid and wall detection)
        run: |
          python -m pip install -r services/vision/requirements.txt
          cd services/vision
          python -m unittest -v test_detector.py test_walls.py test_wall_worker.py

      - name: Build
        run: npm run build

      - name: Smoke-test the server boots and answers /health
        run: |
          npm start &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "server healthy"
              curl -s http://localhost:3001/health
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy in time"
          exit 1

  # Fails on a new high/critical advisory in a production dependency (security-hardening). Reads the
  # committed lockfile, so it needs no install; known advisories are allowlisted in the script.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Audit production dependencies
        run: npm run audit

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit vision dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r services/vision/requirements.txt

  # Build only (no push): catches a broken production Dockerfile before it reaches a VM.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        run: docker build -f Dockerfile.server -t vtt-server .
      - name: Build web image
        run: docker build -f Dockerfile.web -t vtt-web .
      - name: Build MCP image
        run: docker build -f Dockerfile.mcp -t vtt-mcp .
      - name: Check the Caddyfile against the web image's Caddy
        run: docker run --rm vtt-web caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build vision image
        run: docker build -t vtt-vision services/vision
