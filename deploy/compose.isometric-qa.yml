# Use with docker-compose.yml and a dedicated -p project name. No existing dev volumes are used.
services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  s3:
    ports: !reset []
  vision:
    ports: !reset []
  server:
    ports: !override ["127.0.0.1:13001:3001"]
    environment:
      CLIENT_ORIGIN: http://127.0.0.1:15173
  web:
    ports: !override ["127.0.0.1:15173:5173"]
