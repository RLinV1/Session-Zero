# Production stack on one VM (docs/DEPLOYMENT.md). Needs an env file; copy deploy/env.production.example:
#
#   cp deploy/env.production.example .env.production   # fill it in
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Only the web container is published. Postgres, Redis, S3 and vision stay on the private network.
name: vtt
# The server logs every request, and Docker keeps logs forever unless told otherwise: a flood would fill the disk.
x-rotated-logs: &rotated-logs
  driver: json-file
  options: { max-size: 10m, max-file: "3" }
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    networks: [data]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vtt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-vtt}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    networks: [data, walls]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    command: ["sh", "-c", "exec docker-entrypoint.sh redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - redisdata:/data
  # S3-compatible storage (SeaweedFS) with a real access key. The config file is written at start
  # from the env so the key is never in git. Use letters and digits in the key and secret (JSON).
  s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    networks: [data]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 512
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env.production}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env.production}
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '{"identities":[{"name":"vtt","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - s3data:/data
  vision:
    build: ./services/vision
    restart: unless-stopped
    <<: *hardened
    read_only: true
    tmpfs: [/tmp]
    networks: [vision]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    environment:
      PORT: 8000
      OPENCV_IO_MAX_IMAGE_PIXELS: 40000000
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 3s
      timeout: 3s
      retries: 30
  # BullMQ consumer for wall detection (FR-GM-11). Off by default because wall detection is not
  # ready: without this worker a queued wall job waits for the server's 10 minute job timeout
  # before failing. Enable with `docker compose ... --profile walls`. When enabled it must stay
  # running (never scale to zero).
  vision-walls:
    profiles: ["walls"]
    build: ./services/vision
    restart: unless-stopped
    <<: *hardened
    read_only: true
    tmpfs: [/tmp]
    networks: [walls]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    command: ["python", "wall_worker.py"]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OPENCV_IO_MAX_IMAGE_PIXELS: 40000000
    depends_on:
      redis: { condition: service_healthy }
  # One-shot: applies Prisma migrations, then exits. The server waits for it.
  migrate:
    build: { context: ., dockerfile: Dockerfile.server }
    restart: "no"
    command: ["npm", "run", "prisma:migrate", "--workspace=@vtt/server"]
    working_dir: /app
    networks: [data]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vtt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vtt}
    depends_on:
      postgres: { condition: service_healthy }
  server:
    build: { context: ., dockerfile: Dockerfile.server }
    restart: unless-stopped
    <<: *hardened
    networks: [edge, data, vision]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    logging: *rotated-logs
    environment:
      NODE_ENV: production
      PORT: 3001
      UV_THREADPOOL_SIZE: 8
      DATABASE_URL: postgres://${POSTGRES_USER:-vtt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vtt}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: ${S3_BUCKET:-vtt-assets}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      VISION_URL: http://vision:8000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?set CLIENT_ORIGIN (the public URL, e.g. https://vtt.example.com) in .env.production}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env.production}
      SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT in .env.production}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER in .env.production}
      SMTP_PASS: ${SMTP_PASS:?set SMTP_PASS in .env.production}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env.production}
      # One proxy (the web container) sits in front of the server. Stays 1 behind a CDN too: Caddy
      # sends a single address, and TRUSTED_PROXIES decides whose word it takes (docs/EDGE-PROTECTION.md).
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Account ids allowed to read /admin/stats (ADR 0080). Empty: nobody, and the page answers 404.
      ADMIN_ACCOUNT_IDS: ${ADMIN_ACCOUNT_IDS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Studio, the AI scene editor inside ChatGPT (ADR 0073). Off while STUDIO_PUBLIC_ORIGIN is empty. To turn it
      # on, set STUDIO_PUBLIC_ORIGIN to CLIENT_ORIGIN and STUDIO_MEDIA_MODE=local in .env.production. Private
      # artwork then lives in the studioprivate volume, which /uploads and the bucket never serve.
      STUDIO_PUBLIC_ORIGIN: ${STUDIO_PUBLIC_ORIGIN:-}
      STUDIO_MEDIA_MODE: ${STUDIO_MEDIA_MODE:-}
      STUDIO_PRIVATE_DIR: /app/apps/server/studio-private
    volumes:
      - studioprivate:/app/apps/server/studio-private
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
      vision: { condition: service_healthy }
  # Lets people's own AI apps sit at a table (docs/AI-PLAYERS.md). An ordinary client of the server, and
  # nothing depends on it: if it stops, only /mcp fails and browser play carries on (ADR 0052).
  mcp:
    build: { context: ., dockerfile: Dockerfile.mcp }
    restart: unless-stopped
    <<: *hardened
    networks: [edge]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    environment:
      NODE_ENV: production
      PORT: 3002
      ROOM_SERVER_URL: http://server:3001
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?set CLIENT_ORIGIN (the public URL, e.g. https://vtt.example.com) in .env.production}
      # One proxy (the web container) sits in front of this too.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Serves the Studio tools at /mcp/studio when set; must match the server's value.
      STUDIO_PUBLIC_ORIGIN: ${STUDIO_PUBLIC_ORIGIN:-}
    depends_on:
      server: { condition: service_healthy }
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256
    networks: [edge]
    logging: *rotated-logs
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddydata:/data
    depends_on:
      server: { condition: service_healthy }
  # Off by default. A Cloudflare Tunnel connects outward, so the VM's web ports can be closed and all
  # traffic passes Cloudflare first (docs/EDGE-PROTECTION.md). Enable with `--profile cloudflare`.
  cloudflared:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    networks: [edge]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      web: { condition: service_started }
networks:
  edge:
  data:
    internal: true
  vision:
    internal: true
  walls:
    internal: true
volumes:
  pgdata:
  redisdata:
  s3data:
  studioprivate:
  caddydata:
