# Production stack on one VM (docs/DEPLOYMENT.md). Needs an env file; copy deploy/env.production.example:
#
#   cp deploy/env.production.example .env.production   # fill it in
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Only the web container is published. Postgres, Redis, S3 and vision stay on the private network.
name: vtt
# The server logs every request, and Docker keeps logs forever unless told otherwise: a flood would fill the disk.
x-rotated-logs: &rotated-logs
  driver: json-file
  options: { max-size: 10m, max-file: "3" }
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vtt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-vtt}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - redisdata:/data
  # S3-compatible storage (SeaweedFS) with a real access key. The config file is written at start
  # from the env so the key is never in git. Use letters and digits in the key and secret (JSON).
  s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env.production}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env.production}
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '{"identities":[{"name":"vtt","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - s3data:/data
  vision:
    build: ./services/vision
    restart: unless-stopped
    environment:
      PORT: 8000
      OPENCV_IO_MAX_IMAGE_PIXELS: 40000000
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 3s
      timeout: 3s
      retries: 30
  # BullMQ consumer for wall detection (FR-GM-11). Off by default because wall detection is not
  # ready: without this worker a queued wall job waits for the server's 10 minute job timeout
  # before failing. Enable with `docker compose ... --profile walls`. When enabled it must stay
  # running (never scale to zero).
  vision-walls:
    profiles: ["walls"]
    build: ./services/vision
    restart: unless-stopped
    command: ["python", "wall_worker.py"]
    environment:
      REDIS_URL: redis://redis:6379
      OPENCV_IO_MAX_IMAGE_PIXELS: 40000000
    depends_on:
      redis: { condition: service_healthy }
  # One-shot: applies Prisma migrations, then exits. The server waits for it.
  migrate:
    build: { context: ., dockerfile: Dockerfile.server }
    restart: "no"
    command: ["npm", "run", "prisma:migrate", "--workspace=@vtt/server"]
    working_dir: /app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vtt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vtt}
    depends_on:
      postgres: { condition: service_healthy }
  server:
    build: { context: ., dockerfile: Dockerfile.server }
    restart: unless-stopped
    logging: *rotated-logs
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-vtt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vtt}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: ${S3_BUCKET:-vtt-assets}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      VISION_URL: http://vision:8000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?set CLIENT_ORIGIN (the public URL, e.g. https://vtt.example.com) in .env.production}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      # One proxy (the web container) sits in front of the server. Stays 1 behind a CDN too: Caddy
      # sends a single address, and TRUSTED_PROXIES decides whose word it takes (docs/EDGE-PROTECTION.md).
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
      vision: { condition: service_healthy }
  # Lets people's own AI apps sit at a table (docs/AI-PLAYERS.md). An ordinary client of the server, and
  # nothing depends on it: if it stops, only /mcp fails and browser play carries on (ADR 0052).
  mcp:
    build: { context: ., dockerfile: Dockerfile.mcp }
    restart: unless-stopped
    mem_limit: 768m
    environment:
      NODE_ENV: production
      PORT: 3002
      ROOM_SERVER_URL: http://server:3001
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?set CLIENT_ORIGIN (the public URL, e.g. https://vtt.example.com) in .env.production}
      # One proxy (the web container) sits in front of this too.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      server: { condition: service_healthy }
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    restart: unless-stopped
    logging: *rotated-logs
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddydata:/data
    depends_on:
      server: { condition: service_healthy }
  # Off by default. A Cloudflare Tunnel connects outward, so the VM's web ports can be closed and all
  # traffic passes Cloudflare first (docs/EDGE-PROTECTION.md). Enable with `--profile cloudflare`.
  cloudflared:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      web: { condition: service_started }
volumes:
  pgdata:
  redisdata:
  s3data:
  caddydata:
